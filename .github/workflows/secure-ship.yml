name: Secure and Ship

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-ship-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Static safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify storefront files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s thanks.html
          echo "Required storefront files are present."

      - name: Check tracked files for obvious live credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "Stripe live secret key": re.compile(r"sk_live_[A-Za-z0-9]{12,}"),
              "Stripe live restricted key": re.compile(r"rk_live_[A-Za-z0-9]{12,}"),
              "Stripe webhook signing secret": re.compile(r"whsec_[A-Za-z0-9]{12,}"),
          }
          paths = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True, capture_output=True
          ).stdout.split(b"\\0")
          findings = []
          for raw_path in paths:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode("utf-8", "replace"))
              if not path.is_file() or path.stat().st_size > 1_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"{path}: possible {label}")
          if findings:
              print("Potential credentials detected; remove them and rotate any exposed secret.")
              print("\\n".join(findings))
              sys.exit(1)
          print("No obvious Stripe live credentials found in tracked text files.")
          PY

      - name: Confirm checkout is static-only
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'sk_live_[A-Za-z0-9]{12,}|rk_live_[A-Za-z0-9]{12,}|whsec_[A-Za-z0-9]{12,}' --include='*.html' .; then
            echo "Credential-like string found in HTML."
            exit 1
          fi
          echo "Static HTML credential check passed."
